/button></div><div class="datetime-picker-stepper"><button type="button" data-time-step="minute-down">−</button><input class="datetime-picker-minute" type="number" min="0" max="59" inputmode="numeric" aria-label="分钟"><button type="button" data-time-step="minute-up">＋</button></div><div class="datetime-picker-minute-chips"><button type="button" data-minute="0">00</button><button type="button" data-minute="10">10</button><button type="button" data-minute="20">20</button><button type="button" data-minute="30">30</button><button type="button" data-minute="40">40</button><button type="button" data-minute="50">50</button></div></div></div><div class="datetime-picker-footer"><small>按本机时区执行预约发布</small><button type="button" class="datetime-picker-confirm">确定</button></div></div></div>';const picker=field.querySelector('.datetime-picker');const trigger=picker.querySelector('.datetime-picker-trigger');const panel=picker.querySelector('.datetime-picker-panel');const hidden=picker.querySelector('#param-publish-at');const valueLabel=picker.querySelector('.datetime-picker-value');const monthLabel=picker.querySelector('.datetime-picker-month');const daysGrid=picker.querySelector('.datetime-picker-days');const clock=picker.querySelector('.datetime-picker-clock');const hourLabel=picker.querySelector('.datetime-picker-hour');const minuteLabel=picker.querySelector('.datetime-picker-minute');const pad=value=>String(value).padStart(2,'0');const syncValue=()=>{const date=`${selectedYear}-${pad(selectedMonth+1)}-${pad(selectedDay)}`;hidden.value=`${date}T${pad(selectedHour)}:${pad(selectedMinute)}`;state.pendingPublishAt=hidden.value;valueLabel.textContent=`${date} ${pad(selectedHour)}:${pad(selectedMinute)}`;clock.textContent=`${pad(selectedHour)}:${pad(selectedMinute)}`;hourLabel.textContent=`${pad(selectedHour)} 时`;minuteLabel.textContent=`${pad(selectedMinute)} 分`;picker.querySelectorAll('[data-minute]').forEach(button=>button.classList.toggle('selected',Number(button.dataset.minute)===selectedMinute))};const drawCalendar=()=>{const monthDate=new Date(selectedYear,selectedMonth,1);monthLabel.textContent=`${selectedYear}年${selectedMonth+1}月`;const firstDay=(monthDate.getDay()+6)%7;const daysInMonth=new Date(selectedYear,selectedMonth+1,0).getDate();const prevDays=new Date(selectedYear,selectedMonth,0).getDate();let html='';for(let index=0;index<42;index++){const dayNumber=index-firstDay+1;let day=dayNumber;let year=selectedYear;let month=selectedMonth;let muted=false;if(dayNumber<1){day=prevDays+dayNumber;month-=1;muted=true;if(month<0){month=11;year-=1}}else if(dayNumber>daysInMonth){day=dayNumber-daysInMonth;month+=1;muted=true;if(month>11){month=0;year+=1}}const isSelected=year===selectedYear&&month===selectedMonth&&day===selectedDay;const now=new Date();const isToday=year===now.getFullYear()&&month===now.getMonth()&&day===now.getDate();html+=`<button type="button" class="datetime-picker-day ${muted?'muted ':''}${isSelected?'selected ':''}${isToday?'today':''}" data-date="${year}-${month}-${day}">${day}</button>`}daysGrid.innerHTML=html;daysGrid.querySelectorAll('[data-date]').forEach(button=>button.addEventListener('click',()=>{const [year,month,day]=button.dataset.date.split('-').map(Number);selectedYear=year;selectedMonth=month;selectedDay=day;drawCalendar();syncValue()}))};const syncVisibility=()=>{field.style.display=publishMode.value==='预约发布'?'flex':'none';if(publishMode.value==='预约发布'){drawCalendar();syncValue()}};trigger.addEventListener('click',event=>{event.stopPropagation();document.querySelectorAll('.datetime-picker.open').forEach(item=>{if(item!==picker)item.classList.remove('open')});picker.classList.toggle('open')});panel.addEventListener('click',event=>event.stopPropagation());picker.querySelectorAll('[data-calendar-nav]').forEach(button=>button.addEventListener('click',()=>{selectedMonth+=button.dataset.calendarNav==='next'?1:-1;if(selectedMonth<0){selectedMonth=11;selectedYear-=1}if(selectedMonth>11){selectedMonth=0;selectedYear+=1}drawCalendar()}));picker.querySelectorAll('[data-time-step]').forEach(button=>button.addEventListener('click',()=>{const step=button.dataset.timeStep;if(step==='hour-up')selectedHour=(selectedHour+1)%24;if(step==='hour-down')selectedHour=(selectedHour+23)%24;if(step==='minute-up'){if(selectedMinute===59){selectedMinute=0;selectedHour=(selectedHour+1)%24}else selectedMinute+=1}if(step==='minute-down'){if(selectedMinute===0){selectedMinute=59;selectedHour=(selectedHour+23)%24}else selectedMinute-=1}syncValue()}));picker.querySelectorAll('[data-minute]').forEach(button=>button.addEventListener('click',()=>{selectedMinute=Number(button.dataset.minute);syncValue()})); hourLabel.addEventListener('change',()=>{selectedHour=Math.max(0,Math.min(23,Number(hourLabel.value)||0));syncValue()});minuteLabel.addEventListener('change',()=>{selectedMinute=Math.max(0,Math.min(59,Number(minuteLabel.value)||0));syncValue()});hourLabel.addEventListener('blur',()=>{hourLabel.value=pad(selectedHour)});minuteLabel.addEventListener('blur',()=>{minuteLabel.value=pad(selectedMinute)});picker.querySelector('.datetime-picker-confirm').addEventListener('click',()=>{syncValue();picker.classList.remove('open')});publishMode.addEventListener('change',syncVisibility);syncVisibility()};
